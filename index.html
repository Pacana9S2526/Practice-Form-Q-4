<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- BOOTSTRAP-JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" type="text/css" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

</head>
<body>
    <main class="text-center">
    <div class="container p-5 mt-5 bg-light text-dark center rounded-3">
        <h1>VOTES VERIFICATION</h1>
        <hr>
        <label for="age">ENTER AGE</label>
        <input type="number" value="1"  id="age" name="age" class="form-control" placeholder="Enter your age">
        <div class="container-fluid" id="Status"></div>
        <hr>
        <h3>VOTING STATUS: <span id="votingStatus" class="boxed"></span></h3>   
        <button type="button" class="btn btn-success" onclick="CheckVotingEligibility()">CHECK ELIGIBILITY</button>
        <button type="button" class="btn btn-secondary" onclick="location.reload()">REFRESH</button>
        <hr>
        <h1>GRADE VERIFICATION</h1>
        <label for="grade">ENTER GRADE</label>
        <input type="number" value="1"  id="grade" name="grade" class="form-control" placeholder="Enter your grade">
        <div class="container-fluid" id="gradeStatus"></div>
        <hr>
        <button type="button" class="btn btn-success" onclick="CheckGrade()">CHECK GRADE</button>
        <button type="button" class="btn btn-secondary" onclick="location.reload()">REFRESH</button>
    </div>
    
    <script src="main.js"></script>

</body>
</html>
